<template>
	<!-- show/hide Agent orchestration statuses -->
	<template if:true={isShowAO}>
			<div class="orchestration-header">
				<div class="orchestration-dot"></div>
				<span class="orchestration-text">{orchestrationStatus}</span>
			</div>
	</template>
	<!--show messages when user has not either AMA or KC permission-->
	<template lwc:if={noKCPermission}>
	    <p class="permissionaccess">
			You do not have permission to view Knowledge Card of Agent Assist,<br> please contact your Admin.
		</p>   
    </template>
	<template lwc:if={noAMAPermission}>
		<p class="permissionaccess">
			You do not have permission to view Ask Me Anything of Agent Assist.,<br />
			please contact your Admin.
		</p>
	</template>
	<!--user has both AMA and KC permission-->
    <template lwc:if={isShowKCAndAMA}>
        <div class="container">
            <div lwc:ref="container" onscroll={handleScroll} class="card-container">
                <c-aa_knowledge-message onloading={handleLoading} onbottom={handleBottom} is-jump-in-present-visible={isJumpInPresentVisible} onreplycard={handleReplyCard}></c-aa_knowledge-message>
            </div>
            <c-aa_ask-me-anything reply-card={replyCard} is-loading={isLoading}></c-aa_ask-me-anything>
        </div>
    </template>
	<!-- user has knowledge cards permission only-->
	<template lwc:elseif={isKnowledgeCards}>
		 <div class="container">
            <div lwc:ref="container" onscroll={handleScroll} class="card-container">
                <c-aa_knowledge-message onloading={handleLoading} onbottom={handleBottom} is-jump-in-present-visible={isJumpInPresentVisible} onreplycard={handleReplyCard}></c-aa_knowledge-message>
            </div>
        </div>
	</template>
	<!-- user has AMA permission only-->
	<template lwc:elseif={isShowAMA}>
		 <div class="container">
            <div lwc:ref="container" onscroll={handleScroll} class="card-container">
                <c-aa_knowledge-message onloading={handleLoading} onbottom={handleBottom} is-jump-in-present-visible={isJumpInPresentVisible} onreplycard={handleReplyCard}></c-aa_knowledge-message>
            </div>
            <c-aa_ask-me-anything reply-card={replyCard} is-loading={isLoading}></c-aa_ask-me-anything>
        </div>
	</template>   
</template>
